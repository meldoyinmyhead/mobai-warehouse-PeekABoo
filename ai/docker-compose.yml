version: "3.8"

services:
  ai-service:
    build: .
    container_name: ai-warehouse-service
    ports:
      - "8000:8000"
    environment:
      - DEBUG=false
      - LOG_LEVEL=INFO
    volumes:
      - ./ai/data:/app/ai/data
      - ./ai/logs:/app/ai/logs
    restart: unless-stopped
    networks:
      - warehouse-network

networks:
  warehouse-network:
    driver: bridge
